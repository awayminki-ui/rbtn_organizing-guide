<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레드버튼 오거나이징 가이드</title>
<style>
  :root{
    --bg: #F6F6F3;
    --surface: #FFFFFF;
    --ink: #1B1C1A;
    --ink-soft: #63645F;
    --ink-mid: #46473F;
    --line: #E3E3DE;
    --line-strong: #C7C7BE;
    --accent: #E4141B;
    --accent-soft: #FCE9E8;
    --danger: #B3492B;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
    --mono: 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;}

  .login-gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .login-gate-box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:36px 32px; max-width:360px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .brand{font-weight:900; font-size:22px; letter-spacing:-0.03em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; display:inline-flex; align-items:baseline; gap:1px;}
  .brand .r-mark{font-size:10px; vertical-align:super; margin-left:1px;}
  p{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:8px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans); width:100%; margin-top:16px; transition:background .15s, border-color .15s, color .15s;}
  .btn-google{background:#fff; color:#3c4043; border:1px solid #dadce0;}
  .btn-google:hover{background:#f8f8f8;}
  .btn-ghost{background:none; color:var(--ink-soft); text-decoration:underline;}
  .field{margin-bottom:12px; text-align:left;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:var(--sans); background:var(--bg); color:var(--ink);}
  .field input:focus, .field select:focus{border-color:var(--accent); outline:none; background:var(--surface);}
  .error-box{display:none; color:var(--danger); font-size:12.5px; margin-top:10px; text-align:center;}
  code{background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px; font-family:var(--mono);}

  /* ---- 앱 화면 (로그인 이후) ---- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:14px;}
  .topbar .brand{font-size:19px; margin-bottom:0;}
  .btn-ghost2, .btn-primary2{width:auto; margin:0; padding:9px 14px; border-radius:8px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-size:13px; font-family:var(--sans); transition:background .15s, border-color .15s, color .15s, box-shadow .15s;}
  .btn-ghost2{background:var(--surface); border:1.5px solid var(--line-strong); color:var(--ink-mid); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .btn-ghost2:hover{color:var(--ink); border-color:var(--ink-soft); background:var(--bg);}
  .btn-ghost2:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary2{background:var(--accent); color:#fff; border:1.5px solid var(--accent);}
  .btn-primary2:hover{background:#B80F15; border-color:#B80F15;}
  .btn-primary2:disabled{opacity:.45; cursor:not-allowed;}
  #roleToggle{display:flex; align-items:center; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px;}
  #roleToggle button{border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:var(--sans);}
  #roleToggle button.active{background:var(--ink); color:#fff;}

  .app{max-width:1080px; margin:0 auto; padding:28px 24px 80px;}
  .app > h2{font-size:19px; letter-spacing:-0.01em;}

  .game-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .game-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:border-color .15s, transform .15s;}
  .game-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .game-card .name{font-weight:800; font-size:16px; letter-spacing:-0.01em; margin:0 0 6px;}
  .game-card .meta{font-size:11.5px; color:var(--ink-mid); font-family:var(--sans); font-weight:600;}
  .game-card.no-guide{opacity:.6;}
  .game-card.no-guide:hover{opacity:.85;}
  .game-card.no-guide .name{color:var(--ink-soft); font-weight:700;}
  .game-card.work-done{background:#EAF6EC; border-color:#B9DFC0;}
  .game-card.work-done:hover{border-color:#7FBE8B;}
  .card-select{width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}

  .selection-panel{background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:14px 16px; margin-bottom:16px;}
  .selection-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .selection-games{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .sel-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:4px 6px 4px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--ink-soft);}
  .sel-chip button{border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:11px; padding:0;}
  .sel-chip button:hover{color:var(--danger);}
  .selection-totals{display:flex; flex-wrap:wrap; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:12px; font-size:14px;}

  .back{background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; font-family:var(--sans);}
  .back:hover{color:var(--ink);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .case-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .case-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--ink);}
  .case-table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .case-table tr:last-child td{border-bottom:none;}
  .case-table tr.case-end td{border-bottom:2px solid var(--ink);}
  .case-table tr.case-end:last-child td{border-bottom:none;}
  .case-table input, .case-table select{width:100%; border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:6px; font-size:13.5px; font-family:var(--sans); color:var(--ink);}
  .case-table input:focus, .case-table select:focus{border-color:var(--accent); background:var(--bg); outline:none;}

  .case-A{--c:#C1440E;} .case-B{--c:#B08900;} .case-C{--c:#4C7A1F;} .case-D{--c:#1F7A5C;}
  .case-E{--c:#1F7A8C;} .case-F{--c:#2A5CA6;} .case-G{--c:#5B3FA6;} .case-H{--c:#9C2E8C;}
  .case-I{--c:#B32E5C;} .case-J{--c:#8C3A2E;} .case-K{--c:#5C5C1F;} .case-L{--c:#3A5C3A;}
  .case-ZIP{--c:#3A6EA5;}
  .case-ITEM{--c:#D98A1D;}
  .case-badge{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-weight:800; font-size:14px; padding:6px 12px 6px 9px; border-radius:7px; border:2.2px solid var(--c); color:var(--c); background:color-mix(in srgb, var(--c) 10%, white); line-height:1;}
  .case-badge::before{content:''; width:9px; height:9px; border-radius:50%; background:var(--c); flex-shrink:0;}
  /* 플라스틱 케이스 없이 구성품 자체를 가리키는 마커: 원 대신 화살표 모양 (연결선과 정확히 이어지도록
     회전각과 뾰족한 끝 위치는 JS에서 연결선과 같은 방식으로 계산해 매번 맞춰줍니다) */
  .marker.marker-item{
    width:28px; height:22px; background:var(--c, #D98A1D); border-radius:0; box-shadow:none;
    border:none;
    clip-path: polygon(100% 50%, 0% 0%, 0% 100%);
    filter: drop-shadow(0 0 0.75px rgba(0,0,0,.9)) drop-shadow(0 0 0.75px rgba(0,0,0,.9)) drop-shadow(0 1.5px 2px rgba(0,0,0,.35));
    transform-origin:100% 50%;
  }

  .tabs{display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:14px; width:fit-content;}
  .tabs button{border:none; background:transparent; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:var(--sans);}
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .photo-stage{position:relative; width:100%; aspect-ratio:4/3; background-color:#EDEDE8; background-size:contain; background-position:center; background-repeat:no-repeat; border-radius:10px; overflow:hidden; border:1px solid var(--line); transition:outline .1s;}
  .photo-stage.dragover{outline:3px dashed var(--accent); outline-offset:-3px;}
  .nav-zone{position:absolute; top:0; bottom:0; width:40%; z-index:2; cursor:pointer; display:flex; align-items:center; font-size:30px; font-weight:700; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.6); opacity:0; transition:opacity .15s, background .15s;}
  .nav-zone:hover{opacity:1;}
  .nav-zone-left{left:0; justify-content:flex-start; padding-left:12px; background:linear-gradient(to right, rgba(0,0,0,.16), transparent);}
  .nav-zone-right{right:0; justify-content:flex-end; padding-right:12px; background:linear-gradient(to left, rgba(0,0,0,.16), transparent);}
  .photo-nav{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .toolbar-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  .toolbar-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .toolbar-divider{width:1px; align-self:stretch; min-height:24px; background:var(--line);}
  @media (max-width:640px){ .toolbar-divider{display:none; width:100%; height:1px; min-height:0;} }
  .marker-size-control{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft);}
  .marker-size-control label{min-width:60px;}
  .marker-size-control input[type=range]{width:110px;}
  .marker{position:absolute; width:var(--marker-size,24px); height:var(--marker-size,24px); border-radius:50%; background:var(--c,var(--accent)); border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); transform:translate(-50%,-50%); cursor:grab; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-weight:700; font-size:calc(var(--marker-size,24px) * 0.46); z-index:5;}
  .line-layer{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:visible;}
  .conn-line{position:absolute; height:0; border-top-style:solid; border-top-color:rgba(80,80,75,.85); border-top-width:var(--conn-line-width, 2.2px); transform-origin:0 0; pointer-events:none;}
  .marker:active{cursor:grabbing;}
  .anno-box{position:absolute; z-index:4; background:rgba(255,255,255,.98); border:1px solid var(--line); border-left:0.35em solid var(--c, var(--line)); border-radius:0.7em; padding:0.7em 0.87em; min-width:13em; max-width:19.1em; box-shadow:0 3px 12px rgba(0,0,0,.2); font-size:calc(11.5px * var(--anno-scale, 1)); cursor:grab;}
  .anno-box.readonly{cursor:default;}
  .anno-box.collapsed{cursor:pointer;}
  .anno-box.selected{box-shadow:0 0 0 2px var(--accent), 0 3px 12px rgba(0,0,0,.25);}
  .anno-box:active{cursor:grabbing;}
  .anno-head{display:flex; align-items:center; gap:0.5em; margin-bottom:0.5em; flex-wrap:wrap;}
  .anno-head select{font-family:var(--mono); font-weight:800; font-size:1.04em; padding:0.17em 0.35em; border:1px solid var(--line); border-radius:0.4em; background:var(--bg);}
  .anno-del{margin-left:auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1.13em; padding:0 0.17em;}
  .anno-del:hover{color:var(--danger);}
  .anno-item{display:flex; gap:0.35em; margin-bottom:0.26em; align-items:center;}
  .anno-item input[type=text]{flex:1; min-width:0; padding:0.26em 0.43em; font-size:0.96em; border:1px solid var(--line); border-radius:0.35em; font-family:var(--sans);}
  .anno-item input[type=number]{width:3.65em; padding:0.26em 0.35em; font-size:0.96em; border:1px solid var(--line); border-radius:0.35em; font-family:var(--sans);}
  .anno-item button{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.96em; padding:0 0.17em;}
  .anno-additem{font-size:0.91em; color:var(--accent); background:none; border:none; cursor:pointer; padding:0.17em 0; font-weight:700; font-family:var(--sans);}
  .anno-label-btn{background:#000; color:#fff; border:none; border-radius:0.35em; font-size:0.87em; padding:0.26em 0.7em; cursor:pointer; font-weight:700; margin-top:0.35em;}
  .anno-label-btn:hover{background:#2a2a2a;}

  /* ---- 사진 자르기/회전 모달 ---- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,20,18,.45); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--surface); border-radius:14px; padding:22px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto;}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .crop-toolbar{display:flex; gap:8px; margin-bottom:10px;}
  .crop-toolbar button{border:1.5px solid var(--line-strong); background:var(--surface); border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:var(--sans); color:var(--ink-mid); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .crop-toolbar button:hover{border-color:var(--ink-soft); color:var(--ink);}
  .crop-canvas-wrap{position:relative; width:100%; background:#111; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
  .crop-canvas-wrap canvas{position:absolute; inset:0; width:100%; height:100%;}
  .crop-box{position:absolute; border:2px solid #fff; box-shadow:0 0 0 2000px rgba(0,0,0,.55); cursor:move;}
  .crop-handle{position:absolute; width:14px; height:14px; background:#fff; border:2px solid var(--ink); border-radius:3px;}
  .crop-handle.corner-nw{left:-7px; top:-7px; cursor:nwse-resize;}
  .crop-handle.corner-ne{right:-7px; top:-7px; cursor:nesw-resize;}
  .crop-handle.corner-sw{left:-7px; bottom:-7px; cursor:nesw-resize;}
  .crop-handle.corner-se{right:-7px; bottom:-7px; cursor:nwse-resize;}
  .crop-handle.edge-n{left:50%; top:-7px; transform:translateX(-50%); cursor:ns-resize;}
  .crop-handle.edge-s{left:50%; bottom:-7px; transform:translateX(-50%); cursor:ns-resize;}
  .crop-handle.edge-w{left:-7px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
  .crop-handle.edge-e{right:-7px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions button{border:none; border-radius:7px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--sans);}
  .modal-actions .btn-cancel{background:var(--surface); color:var(--ink-mid); border:1.5px solid var(--line-strong);}
  .modal-actions .btn-cancel:hover{color:var(--ink); border-color:var(--ink-soft); background:var(--bg);}
  .modal-actions .btn-apply{background:var(--accent); color:#fff; border:1.5px solid var(--accent);}
  .modal-actions .btn-apply:hover{background:#B80F15; border-color:#B80F15;}
  .presence-banner{background:#FFF6DE; border:1px solid #F0DFA8; color:#7a5b12; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:8px; margin-bottom:14px;}

  .pg-body{display:grid; grid-template-columns:1fr 1.3fr; gap:20px; align-items:start;}
  @media (max-width:800px){ .pg-body{grid-template-columns:1fr;} }
  .pg-panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .pg-panel h3{font-size:14px; margin:0 0 12px;}
  .pg-game-list{max-height:480px; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
  .pg-game-row{display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:6px; font-size:13px; cursor:pointer;}
  .pg-game-row:hover{background:var(--bg);}
  .pg-game-name{flex:1;}
  .pg-game-id{font-family:var(--sans); font-weight:600; font-size:11px; color:var(--ink-mid);}
  .pg-top50-badge{font-size:10px; font-weight:800; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, white); border-radius:4px; padding:2px 6px; flex-shrink:0;}
  .pg-search{width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:var(--sans); margin-bottom:10px;}
  .pg-search:focus{outline:none; border-color:var(--accent);}
  .pg-table{width:100%; border-collapse:collapse; font-size:13px;}
  .pg-table th{text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:0 8px 8px; border-bottom:1px solid var(--line);}
  .pg-table td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .pg-size{font-family:var(--sans); font-weight:600; font-size:12px; color:var(--ink-mid);}
  .pg-qty{font-weight:700;}
  .pg-option{font-size:12px; color:var(--ink-soft);}
  .pg-note{font-size:11.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5;}
  .pg-head{margin-bottom:16px;}
  .pg-head h2{font-size:19px; margin:0 0 6px;}
  .pg-desc{font-size:12.5px; color:var(--ink-soft); max-width:640px; line-height:1.5; margin:0 0 12px;}
  .pg-actions{display:flex; gap:8px;}

  /* ---- 도움말 모달 ---- */
  .help-modal{max-width:560px; max-height:85vh; overflow-y:auto;}
  .help-list{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6;}
  .help-list li{margin-bottom:10px;}
  .help-list ul{margin-top:6px; padding-left:16px;}
  .help-list ul li{margin-bottom:6px; font-size:13px; color:var(--ink-soft);}

  /* ---- 진행 현황(대시보드) ---- */
  .dash-progress-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px;}
  .dash-progress-bar-track{position:relative; width:100%; height:28px; background:var(--bg); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
  .dash-progress-bar-fill{position:absolute; top:0; left:0; bottom:0; background:var(--accent); border-radius:999px; transition:width .3s;}
  .dash-progress-bar-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--ink); font-family:var(--sans); text-shadow:0 0 4px #fff, 0 0 8px #fff, 0 0 2px #fff;}
  .dash-count{font-family:var(--sans); font-size:12px; font-weight:700; color:var(--accent);}

  /* ---- 권한 관리 ---- */
  .access-section{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .access-section:last-of-type{border-bottom:none; margin-bottom:8px;}
  .access-section-title{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .access-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; font-size:13px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .access-row:last-child{border-bottom:none;}
  .access-row-pending{flex-direction:column; align-items:stretch; padding:10px 0; border-bottom:1px dashed var(--line);}
  .access-row-pending:last-child{border-bottom:none;}
  .access-person{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .access-empty{font-size:12.5px; color:var(--ink-soft); padding:6px 0;}
  .access-email-only{font-family:var(--sans); font-weight:600; font-size:12.5px; word-break:break-all; color:var(--ink-mid);}
  .access-email-sub{font-family:var(--sans); font-size:11.5px; color:var(--ink-mid); margin-top:1px;}
  .access-actions{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; align-items:center;}

  /* ---- 이전 버전(이력) ---- */
  .history-list{max-height:340px; overflow-y:auto; margin-top:6px;}

      --line:#33342F; --line-strong:#4A4B45; --accent:#F0383E; --accent-soft:#3A1E1E; --danger:#E0795A;

  .lightbox{position:fixed; inset:0; z-index:400; background:rgba(10,10,10,.92); overflow:hidden; touch-action:none;}

  /* ---- 이력 비교 ---- */
  .history-list{max-height:62vh !important;}

  .diff-list{margin:0; padding-left:18px; font-size:12.5px; line-height:1.6;}
  .diff-add{color:#2E8B4A;} .diff-del{color:var(--danger);} .diff-chg{color:var(--ink-mid);}

  .pg-table input[type=number]{width:72px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; font-family:var(--sans);}

  .kbd{display:inline-block; font-family:var(--mono); font-size:11px; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--surface);}

    .qr-cell .qr-id{font-size:10px; color:#555;}
    @page{margin:12mm;}
  }
</style>

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str){
  let out='';
  for (const ch of str){
    const code = ch.charCodeAt(0) - 0xAC00;
    out += (code>=0 && code<=11171) ? CHO[Math.floor(code/588)] : ch;
  }
  return out;
}
/** 검색어가 순수하게 초성(자음)만으로 이루어져 있는지 확인합니다. 완성된 글자(모음 포함)가
 *  하나라도 섞여 있으면 초성 검색이 아니라 일반 텍스트 검색으로 취급합니다. */
function isChosungOnly(str){
  return str.length > 0 && [...str].every(ch => CHO.includes(ch));
}
/** 사용자가 입력한 글자(게임 이름, 구성품, 메모 등)를 화면 HTML에 넣기 전에 특수문자를 바꿔서,
 *  이름에 < 나 따옴표가 들어가도 화면이 깨지거나 엉뚱한 코드가 실행되지 않게 합니다. */
function esc_(v){
  return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/** 게임 ID에는 따옴표·슬래시 등 화면 버튼이나 저장 경로를 깨뜨리는 문자를 쓸 수 없게 합니다. */
function isValidGameId_(id){ return /^[^\s'"`\\/<>&#?%]+$/.test(id); }

/** 이 기기(브라우저)에만 저장하는 개인 설정 (즐겨찾기, 최근 본 게임, 테마 등).
 *  시크릿 창처럼 저장소를 못 쓰는 환경에서도 앱이 멈추지 않도록 실패는 조용히 무시합니다. */
function lsGet_(key, fallback){
  try{ const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }catch(e){ return fallback; }
}
function lsSet_(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function applyTheme_(){
  let t = 'auto';
  try{ t = localStorage.getItem('rbtn_theme') || 'auto'; }catch(e){}
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const btn = document.getElementById('themeToggleBtn');
  if (btn){
    btn.textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🌓';
    btn.title = `화면 테마: ${t === 'dark' ? '어둡게' : t === 'light' ? '밝게' : '자동(기기 설정)'} — 눌러서 바꾸기`;
  }
}
function cycleTheme_(){
  let t = 'auto';
  try{ t = localStorage.getItem('rbtn_theme') || 'auto'; }catch(e){}
  const next = t === 'auto' ? 'light' : t === 'light' ? 'dark' : 'auto';
  try{ localStorage.setItem('rbtn_theme', next); }catch(e){}
  applyTheme_();
}

/** 외부 스크립트를 처음 쓸 때만 불러옵니다. 첫 주소가 막혀 있으면 다음 주소로 다시 시도합니다. */
const scriptLoadPromises_ = {};
function loadScriptOnce_(globalName, urls){
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (scriptLoadPromises_[globalName]) return scriptLoadPromises_[globalName];
  scriptLoadPromises_[globalName] = new Promise((resolve, reject)=>{
    const tryAt = (i)=>{
      if (i >= urls.length){ delete scriptLoadPromises_[globalName]; reject(new Error('라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)')); return; }
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = ()=> window[globalName] ? resolve(window[globalName]) : tryAt(i+1);
      s.onerror = ()=>{ s.remove(); tryAt(i+1); };
      document.head.appendChild(s);
    };
    tryAt(0);
  });
  return scriptLoadPromises_[globalName];
}

function loadQrLib_(){
  return loadScriptOnce_('qrcode', [
    'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'

/** 주어진 글자(주소)를 QR 코드 SVG 문자열로 만듭니다. */
async function makeQrSvg_(text){
  const qrcode = await loadQrLib_();
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

/**
 * ============================================================
 * 주소(#game=ID) ↔ 화면 연결 (바로가기 링크 · QR · 브라우저 뒤로가기)
 * ============================================================
 */
function gameIdFromHash_(){
  const m = location.hash.match(/^#game=(.+)$/);
  if (!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
}
function syncHash_(gameId){
  const want = gameId ? `#game=${encodeURIComponent(gameId)}` : '';
  if (location.hash === want) return;
  if (want) location.hash = want; // 기록이 남아서 브라우저 "뒤로"로 목록에 돌아갈 수 있습니다
  else history.pushState(null, '', location.pathname + location.search);
}
window.addEventListener('hashchange', ()=>{
  if (document.getElementById('appRoot').style.display === 'none') return;
  const id = gameIdFromHash_();
  if (id && id !== currentGameId){
    if (games.some(g=>String(g.id)===id)) openGame(id);
  } else if (!id && currentGameId){
    renderList();
  }
});
window.addEventListener('popstate', ()=>{
  if (document.getElementById('appRoot').style.display === 'none') return;
  if (!gameIdFromHash_() && currentGameId) renderList();
});

async function setRole(r){
  if (r === 'editor' && myApprovedRole !== 'editor') return; // 애초에 편집 권한이 없는 계정
  if (r === 'viewer' && currentRole === 'editor' && !confirmLeaveDetail_()) return; // 저장 안 한 변경사항 확인
  currentRole = r;
  updateRoleToggleUI_();

  if (currentGameId){
    if (r === 'editor'){
      const gotLock = await ensureEditLockForGame_(currentGameId);
      if (!gotLock){
        currentRole = 'viewer';
        updateRoleToggleUI_();
      } else {
        enterPresence_(currentGameId);
      }
    } else {
      leavePresence_();
    }
    resetChangeTracking_();
    renderDetail();
  }
}

      getDoc(doc(db, 'viewers', email)),
      getDoc(doc(db, 'pending', email)),
    ]);

    const myDoc = editorSnap.exists() ? editorSnap : viewerSnap.exists() ? viewerSnap : null;
    if (myDoc){
      const d = myDoc.data() || {};
      myProfile_ = { name: d.name || '', storeCode: d.storeCode || '', position: d.position || '' };
    }
    if (editorSnap.exists()) return enterApp(email, 'editor');
    if (viewerSnap.exists()) return enterApp(email, 'viewer');
    if (pendingSnap.exists()) return renderPending(email, false);
    return renderProfileForm(email);
  }catch(e){
    console.error('로그인 확인 실패:', e);
    gateContent.innerHTML = `
      <div class="brand">RED BUTTON<span class="r-mark">®</span></div>
      <p style="color:var(--danger);">로그인 확인 중 오류가 발생했습니다.<br>(개발자 도구 콘솔에 자세한 내용이 남습니다)</p>

      <button class="btn btn-ghost" id="logoutBtnErr">다시 로그인</button>
    `;
    document.getElementById('logoutBtnErr').addEventListener('click', ()=>signOut(auth));
  }
}

let trashedGames_ = []; // 휴지통으로 옮긴(삭제 표시된) 게임들 — 목록·구매 가이드 등에서는 빠지고, 편집자가 복구할 수 있습니다

async function loadGames(){
  const snap = await getDocs(collection(db, 'games'));
  games = [];
  trashedGames_ = [];
  snap.forEach(d => {
    const g = { id: d.id, ...d.data() };
    (g.deleted ? trashedGames_ : games).push(g);
  });
  games.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  trashedGames_.sort((a,b)=> (b.deletedAt||0) - (a.deletedAt||0));
}

/** 게임 ID가 이미 쓰이고 있는지 (휴지통에 있는 게임 포함) */
function isGameIdTaken_(id){
  return games.some(x => String(x.id) === id) || trashedGames_.some(x => String(x.id) === id);
}

/**
 * ============================================================
 * 게임별 JSON 파일로 개별 교체 (game_535.json 처럼 ID가 담긴 파일들을
 * 각각 읽어서, 그 게임 하나씩만 Firestore에 덮어씁니다)
 * ============================================================
 */
let gameReplaceParsed_ = []; // [{ fileName, guessedId, gameData, parseError }]

/** 파일명에서 게임 ID로 보이는 숫자를 하나 뽑아냅니다. (예: game_535.json -> "535") */
function guessGameIdFromFileName_(fileName){
  const base = fileName.replace(/\.json$/i, '');
  const m = base.match(/(\d+)/);
  return m ? m[1] : '';
}

/** 파일 하나의 JSON에서 실제 "게임 데이터 객체"를 뽑아냅니다. (여러 포맷을 허용) */
function extractGameObjectFromJson_(data){
  if (!data || typeof data !== 'object') return null;
  if (Array.isArray(data.games) && data.games.length) return data.games[0]; // 마이그레이션 묶음 포맷도 허용
  if (data.name !== undefined || data.cases !== undefined || data.id !== undefined) return data; // 게임 객체 그 자체
  return null;
}

async function previewGameReplaceFiles_(){
  const input = document.getElementById('gameReplaceFileInput');
  const files = Array.from(input.files || []);
  const previewEl = document.getElementById('gameReplacePreview');
  gameReplaceParsed_ = [];
  if (!files.length){ previewEl.innerHTML = ''; return; }

  for (const file of files){
    let entry = { fileName: file.name, guessedId: '', gameData: null, parseError: '' };
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const gameObj = extractGameObjectFromJson_(data);
      if (!gameObj){
        entry.parseError = '이 파일에서 게임 데이터를 찾지 못했습니다.';
      } else {
        entry.gameData = gameObj;
        entry.guessedId = gameObj.id !== undefined && gameObj.id !== null && String(gameObj.id).trim() !== ''
          ? String(gameObj.id).trim()
          : guessGameIdFromFileName_(file.name);
      }
    }catch(e){
      entry.parseError = 'JSON 파싱 실패: ' + e.message;
    }
    gameReplaceParsed_.push(entry);
  }
  renderGameReplacePreview_();
}

function renderGameReplacePreview_(){
  const previewEl = document.getElementById('gameReplacePreview');
  if (!gameReplaceParsed_.length){ previewEl.innerHTML = ''; return; }

  const rows = gameReplaceParsed_.map((entry, idx) => {
    if (entry.parseError){
      return `
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:6px 8px;">${esc_(entry.fileName)}</td>
          <td colspan="3" style="padding:6px 8px; color:#c0392b;">❌ ${esc_(entry.parseError)}</td>
        </tr>`;
    }
    const currentGame = games.find(g => String(g.id) === String(entry.guessedId));
    const newName = entry.gameData.name || '(이름 없음)';
    const statusHtml = currentGame
      ? `기존: <b>${esc_(currentGame.name)}</b> → 교체 후: <b>${esc_(newName)}</b>`
      : `<span style="color:#b8860b;">⚠ 이 ID의 기존 게임이 없습니다 — 새로 생성됩니다</span>`;
    return `
      <tr style="border-bottom:1px solid var(--line);">

        <td style="padding:6px 8px;"><input type="text" data-idx="${idx}" class="grIdInput" value="${esc_(entry.guessedId)}"
              style="width:90px; padding:5px 8px; border:1px solid var(--line); border-radius:5px; font-size:12.5px;"
              onchange="updateGameReplaceId_(${idx}, this.value)"></td>
        <td style="padding:6px 8px; font-size:12px;">${statusHtml}</td>

              <input type="checkbox" class="grIncludeCheck" data-idx="${idx}" checked> 포함</label></td>
      </tr>`;
  }).join('');

  previewEl.innerHTML = `
    <table style="border-collapse:collapse; width:100%; max-width:760px; font-size:12.5px; margin:10px 0;">
      <thead>
        <tr style="text-align:left; border-bottom:1px solid var(--line);">
          <th style="padding:6px 8px;">파일명</th>
          <th style="padding:6px 8px;">게임 ID</th>
          <th style="padding:6px 8px;">미리보기</th>
          <th style="padding:6px 8px;"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="btn btn-primary2" style="width:auto;" onclick="startGameReplace_()">선택한 게임 교체 실행</button>
  `;
}

function updateGameReplaceId_(idx, value){
  if (gameReplaceParsed_[idx]) gameReplaceParsed_[idx].guessedId = value.trim();
}

function grLog_(msg){
  const el = document.getElementById('gameReplaceLog');
  if (el) el.textContent += msg + '\n';
  if (el) el.scrollTop = el.scrollHeight;
}

async function startGameReplace_(){
  const includeChecks = Array.from(document.querySelectorAll('.grIncludeCheck'));
  const targets = [];
  for (const chk of includeChecks){
    const idx = Number(chk.dataset.idx);
    const entry = gameReplaceParsed_[idx];
    if (!entry || entry.parseError) continue;
    if (!chk.checked) continue;
    const id = (entry.guessedId || '').trim();
    if (!id){
      grLog_(`❌ "${entry.fileName}" — 게임 ID를 확인할 수 없어 건너뜁니다.`);
      continue;
    }
    targets.push({ id, gameData: entry.gameData, fileName: entry.fileName });
  }

  if (!targets.length){ alert('교체할 게임이 없습니다.'); return; }

  const summary = targets.map(t => `#${t.id} (${t.fileName})`).join(', ');
  if (!confirm(`다음 게임 ${targets.length}개를 교체합니다: ${summary}\n\n현재 내용을 덮어씁니다. 계속할까요?`)) return;

  document.getElementById('gameReplaceLog').textContent = '';
  grLog_(`게임 ${targets.length}개 교체 시작...\n`);

  for (let i=0; i<targets.length; i++){
    const { id, gameData: g, fileName } = targets[i];
    try{
      const photos = [];
      for (const p of (g.photos||[])){
        const newPhoto = { markers: p.markers||[], labels: p.labels||[] };
        if (p.imageUrl && p.imageUrl.startsWith('data:')){
          const blob = dataURLtoBlob_(p.imageUrl);
          const storagePath = `games/${id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          await uploadBytes(ref(storage, storagePath), blob);
          newPhoto.storagePath = storagePath;
        } else if (p.storagePath){
          newPhoto.storagePath = p.storagePath; // 이미 Storage에 있는 사진은 그대로 참조만 유지
        } else {
          grLog_(`  ⚠ "${fileName}" 사진 하나에 이미지 데이터가 없어 건너뜁니다.`);
          continue;
        }
        photos.push(newPhoto);
      }
      const gameDoc = {
        name: g.name || '',
        cases: g.cases || [],
        photos: photos,
        guideDone: !!g.guideDone,
        completedBy: g.completedBy || [],
        note: g.note || '',
        updatedAt: Date.now()
      };
      await setDoc(doc(db, 'games', String(id)), gameDoc);
      grLog_(`  (${i+1}/${targets.length}) #${id} ${g.name || ''} — 완료`);
    }catch(e){
      grLog_(`  (${i+1}/${targets.length}) #${id} — ❌ 실패: ${e.message}`);
    }
  }

  grLog_('\n목록 새로고침 중...');
  await loadGames();
  grLog_('✅ 교체 완료!');
}

function migLog_(msg){
  const el = document.getElementById('migrationLog');
  if (el) el.textContent += msg + '\n';
  if (el) el.scrollTop = el.scrollHeight;
}

function dataURLtoBlob_(dataUrl){
  const parts = dataUrl.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(parts[1]);
  const array = new Uint8Array(binary.length);
  for (let i=0; i<binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

async function startMigration_(){
  const input = document.getElementById('migrationFileInput');
  const files = Array.from(input.files || []);
  if (!files.length){ alert('파일을 선택해주세요.'); return; }

  const singleGameMode = document.getElementById('singleGameModeCheck')?.checked;
  const singleGameId = document.getElementById('singleGameIdInput')?.value.trim();
  if (singleGameMode && !singleGameId){ alert('복구할 게임 ID를 입력해주세요.'); return; }

  // 선택된 파일들을 전부 읽어서, "메타(계정/매장)"와 "게임 묶음"들을 하나로 합칩니다.
  let merged = { editors: [], viewers: [], pending: [], stores: [], profiles: {}, games: [] };
  for (const file of files){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.editors) merged.editors.push(...data.editors);
      if (data.viewers) merged.viewers.push(...data.viewers);
      if (data.pending) merged.pending.push(...data.pending);
      if (data.stores) merged.stores.push(...data.stores);
      if (data.profiles) Object.assign(merged.profiles, data.profiles);
      if (data.games) merged.games.push(...data.games);
    }catch(e){
      migLog_(`❌ 파일을 읽지 못했습니다: ${file.name}`);
      return;
    }
  }

  if (singleGameMode){
    merged.games = merged.games.filter(g => String(g.id) === String(singleGameId));
    merged.editors = []; merged.viewers = []; merged.pending = []; merged.stores = [];
    if (!merged.games.length){
      migLog_(`❌ 선택한 파일들에서 게임 ID "${singleGameId}"를 찾지 못했습니다.`);
      return;
    }
  }

  const data = merged;

  migLog_(singleGameMode
    ? `게임 ID "${singleGameId}" 발견: ${data.games[0].name}`
    : `불러온 파일 ${files.length}개: 게임 ${data.games.length}개, 편집자 ${data.editors.length}명, 뷰어 ${data.viewers.length}명, 매장 ${data.stores.length}개`);
  const confirmMsg = singleGameMode
    ? `"${data.games[0].name}" (ID ${singleGameId})만 다시 가져옵니다. 지금 있는 내용을 덮어씁니다. 계속할까요?`
    : '가져오기를 시작할까요? 시간이 걸릴 수 있습니다.';
  if (!confirm(confirmMsg)) return;

  // ---- 1) 매장 ----
  migLog_('\n[1/4] 매장 정보 등록 중...');
  for (const s of data.stores){
    try{ await setDoc(doc(db, 'stores', s.code), { name: s.name }); }
    catch(e){ migLog_(`  ⚠ 매장 등록 실패: ${s.code} - ${e.message}`); }
  }
  migLog_(`  완료 (${data.stores.length}개)`);

  // ---- 2) 편집자/뷰어/대기 ----
  migLog_('\n[2/4] 편집자·뷰어 계정 등록 중...');
  const profiles = data.profiles;
  for (const email of data.editors){
    try{ await setDoc(doc(db, 'editors', email), { ...(profiles[email]||{}), addedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 편집자 등록 실패: ${email}`); }
  }
  for (const email of data.viewers){
    try{ await setDoc(doc(db, 'viewers', email), { ...(profiles[email]||{}), addedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 뷰어 등록 실패: ${email}`); }
  }
  for (const email of data.pending){
    try{ await setDoc(doc(db, 'pending', email), { ...(profiles[email]||{}), requestedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 대기 등록 실패: ${email}`); }
  }
  migLog_(`  완료 (편집자 ${data.editors.length}명, 뷰어 ${data.viewers.length}명, 대기 ${data.pending.length}명)`);

  // ---- 3) 게임 (사진은 Storage로) ----
  migLog_('\n[3/4] 게임 데이터 가져오는 중...');
  const games_ = data.games;
  for (let i=0; i<games_.length; i++){
    const g = games_[i];
    try{
      const photos = [];
      for (const p of (g.photos||[])){
        const newPhoto = { markers: p.markers||[], labels: p.labels||[] };
        if (p.imageUrl && p.imageUrl.startsWith('data:')){
          const blob = dataURLtoBlob_(p.imageUrl);
          const storagePath = `games/${g.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          await uploadBytes(ref(storage, storagePath), blob);
          newPhoto.storagePath = storagePath;
        }
        photos.push(newPhoto);
      }
      const gameDoc = {
        name: g.name || '',
        cases: g.cases || [],
        photos: photos,
        guideDone: !!g.guideDone,
        completedBy: g.completedBy || [],
        note: g.note || '',
        updatedAt: Date.now()
      };
      await setDoc(doc(db, 'games', String(g.id)), gameDoc);
      migLog_(`  (${i+1}/${games_.length}) ${g.name} - 완료`);
    }catch(e){
      migLog_(`  (${i+1}/${games_.length}) ${g.name} - ❌ 실패: ${e.message}`);
    }
  }

  // ---- 4) 마무리 ----
  migLog_('\n[4/4] 목록 새로고침 중...');
  await loadGames();
  migLog_('\n✅ 가져오기 완료!');
}

/**
 * 전체 게임의 "케이스 종류별 수량"을 CSV로 내보냅니다. (엑셀 구매가이드 양식의 게임목록 탭에
 * 그대로 붙여넣을 수 있도록, 게임ID·게임이름·A~L 순서로 열을 맞췄습니다. 지퍼백/구성품은
 * 엑셀 양식에서 다루지 않으므로 포함하지 않습니다.)
 */
function exportGameCaseCountsCsv_(){
  const PLASTIC_CASE_TYPES = CASE_TYPES.filter(t => t !== 'ZIP');
  const top50Ids = new Set(TOP50_CASE_GAMES.map(g=>g.id));
  // 엑셀 양식의 C열(게임ID)부터 붙여넣는 형식과 그대로 맞췄습니다: 게임ID, 게임이름, 특이사항(게임 메모), TOP50(1/0), A~L.
  // "선택"은 엑셀 쪽에서 TOP50 스위치 + 개별설정으로 정하므로 CSV에는 포함하지 않습니다.
  const rows = [['게임ID', '게임이름', '특이사항', 'TOP50', ...PLASTIC_CASE_TYPES]];

  games.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko')).forEach(g=>{
    const counts = {};
    (g.cases||[]).forEach(c=>{ if (c.caseType !== 'ZIP' && c.caseType !== NON_CASE_TYPE) counts[c.caseType] = (counts[c.caseType]||0) + 1; });
    const isTop50 = top50Ids.has(String(g.id));
    rows.push([g.id, g.name || '', g.note || '', isTop50 ? 1 : 0, ...PLASTIC_CASE_TYPES.map(t => counts[t] || 0)]);
  });

  const csvEscape = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM 포함: 엑셀에서 한글 깨짐 방지
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `게임별_케이스수량_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function renderBulkDownloadGameList_(){
  const listEl = document.getElementById('bulkGameList');
  const countEl = document.getElementById('bulkSelectedCount');
  if (!listEl) return;

  const q = bulkDownloadSearch_.trim();
  const visibleGames = games
    .filter(g => !q || (g.name||'').includes(q) || (isChosungOnly(q) && getChosung(g.name||'').includes(q)))
    .slice()
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko'));

  listEl.innerHTML = visibleGames.map(g=>{
    const checked = bulkDownloadSelected_.has(String(g.id));
    const photoCount = (g.photos||[]).length;
    return `
      <label class="pg-game-row">
        <input type="checkbox" ${checked?'checked':''} ${photoCount?'':'disabled'} onchange="toggleBulkDownloadGameSelect_('${g.id}', this.checked)">
        <span class="pg-game-name">${esc_(g.name)}${g.guideDone?'':' <span style=\"color:var(--ink-soft); font-weight:400;\">(가이드 준비중)</span>'}</span>
        <span class="pg-game-id">${photoCount ? `사진 ${photoCount}장` : '사진 없음'}</span>
      </label>`;
  }).join('') || '<p style="font-size:12.5px; color:var(--ink-soft);">검색 결과가 없습니다.</p>';

  if (countEl) countEl.textContent = `게임 선택 (${bulkDownloadSelected_.size}개 선택됨)`;
}

function toggleBulkDownloadGameSelect_(id, checked){
  if (checked) bulkDownloadSelected_.add(id); else bulkDownloadSelected_.delete(id);
  renderBulkDownloadGameList_();
}
function selectAllGuideDoneGames_(){
  bulkDownloadSelected_.clear();
  games.filter(g=>g.guideDone && (g.photos||[]).length).forEach(g=>bulkDownloadSelected_.add(String(g.id)));
  renderBulkDownloadGameList_();
}
function selectAllBulkDownloadGames_(){
  games.filter(g=>(g.photos||[]).length).forEach(g=>bulkDownloadSelected_.add(String(g.id)));
  renderBulkDownloadGameList_();
}
function deselectAllBulkDownloadGames_(){
  bulkDownloadSelected_.clear();
  renderBulkDownloadGameList_();
}

function bulkLog_(msg){
  const el = document.getElementById('bulkDownloadLog');
  if (el){ el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; }
}

/** JSZip을 처음 쓸 때만 CDN에서 불러옵니다 (여러 이미지를 zip 하나로 묶기 위함). */
let jszipLoadPromise_ = null;
function loadJSZip_(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (jszipLoadPromise_) return jszipLoadPromise_;
  jszipLoadPromise_ = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = ()=>resolve(window.JSZip);
    s.onerror = ()=>reject(new Error('JSZip 라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)'));
    document.head.appendChild(s);
  });
  return jszipLoadPromise_;
}

async function startBulkDownload_(){
  const selected = games.filter(g => bulkDownloadSelected_.has(String(g.id)) && (g.photos||[]).length);
  if (!selected.length){ alert('사진이 있는 게임을 하나 이상 선택해주세요.'); return; }

  document.getElementById('bulkDownloadLog').textContent = '';
  bulkLog_('준비 중...');

  let JSZip;
  try{
    JSZip = await loadJSZip_();
  }catch(e){
    bulkLog_('⚠ zip 압축 도구를 불러오지 못해, 파일을 하나씩 개별 다운로드합니다.\n');
    await startBulkDownloadIndividually_(selected);
    return;
  }

  const zip = new JSZip();
  const totalPhotos = selected.reduce((sum,g)=>sum + (g.photos||[]).length, 0);
  let done = 0;
  bulkLog_(`게임 ${selected.length}개, 사진 ${totalPhotos}장을 이미지로 만드는 중...\n`);

  for (const g of selected){
    const usedNames = {};
    for (let i=0; i<g.photos.length; i++){
      try{
        const canvas = await renderPhotoToCanvas_(g, g.photos[i], GUIDE_EXPORT_DEFAULT_REF_WIDTH);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        let baseName = (g.name || `game_${g.id}`).replace(/[\\/:*?"<>|]/g, '_');
        let fileName = g.photos.length > 1 ? `${baseName}_사진${i+1}.png` : `${baseName}.png`;
        if (usedNames[fileName]){ fileName = `${baseName}_사진${i+1}_${g.id}.png`; }
        usedNames[fileName] = true;
        zip.file(fileName, blob);
        done++;
        bulkLog_(`  (${done}/${totalPhotos}) ${g.name} - 사진 ${i+1} 완료`);
      }catch(e){
        bulkLog_(`  ❌ ${g.name} - 사진 ${i+1} 실패: ${e.message}`);
      }
    }
  }

  bulkLog_('\nzip 파일 압축 중...');
  try{
    const zipBlob = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `가이드_이미지_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    bulkLog_('✅ 완료! zip 파일 다운로드를 시작합니다.');
  }catch(e){
    bulkLog_('❌ zip 파일 생성 중 문제가 발생했습니다: ' + e.message);
  }
}

/** zip 압축 도구를 못 쓸 때의 대체 방법: 파일을 하나씩 순서대로 개별 다운로드합니다. */
async function startBulkDownloadIndividually_(selected){
  const totalPhotos = selected.reduce((sum,g)=>sum + (g.photos||[]).length, 0);
  let done = 0;
  for (const g of selected){
    for (let i=0; i<g.photos.length; i++){
      try{
        const canvas = await renderPhotoToCanvas_(g, g.photos[i], GUIDE_EXPORT_DEFAULT_REF_WIDTH);
        const suffix = g.photos.length > 1 ? `_사진${i+1}` : '';
        downloadCanvasAsPng_(canvas, `${g.name || 'game'}${suffix}.png`);
        done++;
        bulkLog_(`  (${done}/${totalPhotos}) ${g.name} - 사진 ${i+1} 다운로드`);
      }catch(e){
        bulkLog_(`  ❌ ${g.name} - 사진 ${i+1} 실패: ${e.message}`);
      }
      await new Promise(r=>setTimeout(r, 350));
    }
  }
  bulkLog_('✅ 완료!');
}

let showDashboard_ = false;
let dashboardFilter_ = 'all'; // 'all' | 'done' | 'undone'

let dashboardPeople_ = null; // { storeOfEmail: {email: storeCode}, stores: [{code,name,members}] } — 진행현황을 열 때 한 번 불러옵니다
let dashboardStore_ = ''; // 진행현황 표에서 특정 매장 기준으로 볼 때의 매장 코드

async function openDashboard(){
  if (!confirmLeaveDetail_()) return;
  syncHash_(null);
  leavePresence_();
  showDashboard_ = true;
  currentGameId = null;
  appEl.innerHTML = `<p>불러오는 중...</p>`;
  try{
    const [editorsSnap, viewersSnap, storesSnap] = await Promise.all([
      getDocs(collection(db, 'editors')),
      getDocs(collection(db, 'viewers')),
      getDocs(collection(db, 'stores')),
    ]);
    const storeOfEmail = {};
    const memberCount = {};
    [editorsSnap, viewersSnap].forEach(snap => snap.forEach(d => {
      const code = (d.data() || {}).storeCode || '';
      storeOfEmail[d.id.toLowerCase()] = code;
      if (code) memberCount[code] = (memberCount[code] || 0) + 1;
    }));
    const stores = [];
    storesSnap.forEach(d => stores.push({ code: d.id, name: (d.data()||{}).name || d.id, members: memberCount[d.id] || 0 }));
    stores.sort((a,b)=> String(a.name).localeCompare(String(b.name), 'ko'));
    dashboardPeople_ = { storeOfEmail, stores };
  }catch(e){
    console.error('진행현황: 사용자/매장 정보를 불러오지 못했습니다', e);
    dashboardPeople_ = { storeOfEmail: {}, stores: [] };
  }
  if (showDashboard_) renderDashboard();
}
function closeDashboard(){
  showDashboard_ = false;
  renderList();
}
function setDashboardFilter(v){ dashboardFilter_ = v; renderDashboard(); }
function setDashboardStore_(code){ dashboardStore_ = code; renderDashboard(); }

/** 게임 하나를 "작업 완료"로 체크한 사람들이 속한 매장 코드 목록 */
function storesDoneForGame_(g){
  const map = (dashboardPeople_ && dashboardPeople_.storeOfEmail) || {};
  const set = new Set();
  (g.completedBy||[]).forEach(email => { const code = map[String(email).toLowerCase()]; if (code) set.add(code); });
  return set;
}
function openReportsOf_(g){ return (g.missingReports||[]).filter(r => !r.resolved); }

function renderDashboard(){
  const total = games.length;
  const doneCount = games.filter(g=>g.guideDone).length;
  const pct = total ? Math.round(doneCount/total*100) : 0;
  const people = dashboardPeople_ || { storeOfEmail:{}, stores:[] };
  const storeName = code => (people.stores.find(s=>s.code===code)||{}).name || code;

  // ---- 매장별 작업 완료율 (가이드가 완성된 게임 기준) ----
  const readyGames = games.filter(g=>g.guideDone);
  const storeDoneSets = games.map(g => storesDoneForGame_(g));
  const storeRows = people.stores.filter(s=>s.members > 0).map(s=>{
    const done = readyGames.filter(g => storeDoneSets[games.indexOf(g)].has(s.code)).length;
    const p = readyGames.length ? Math.round(done/readyGames.length*100) : 0;
    return { ...s, done, pct: p };
  }).sort((a,b)=> b.pct - a.pct || String(a.name).localeCompare(String(b.name), 'ko'));

  let filtered = games;
  if (dashboardFilter_ === 'done') filtered = games.filter(g=>g.guideDone);
  if (dashboardFilter_ === 'undone') filtered = games.filter(g=>!g.guideDone);
  if (dashboardFilter_ === 'reports') filtered = games.filter(g=>openReportsOf_(g).length);
  if (dashboardFilter_ === 'storeUndone' && dashboardStore_) filtered = games.filter(g=>g.guideDone && !storeDoneSets[games.indexOf(g)].has(dashboardStore_));
  filtered = filtered.slice().sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  const totalOpenReports = games.reduce((n,g)=> n + openReportsOf_(g).length, 0);
  const btnStyle = v => dashboardFilter_===v ? 'background:var(--ink); color:var(--surface);' : '';

  appEl.innerHTML = `
    <button class="back" onclick="closeDashboard()">← 목록으로</button>
    <h2 style="margin:0 0 6px;">📊 작업 진행 현황</h2>
    <div class="dash-progress-card">
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">${pct}% · 가이드 완료 ${doneCount}/${total}개${totalOpenReports ? ` · <b style="color:var(--accent);">미해결 누락 신고 ${totalOpenReports}건</b>` : ''}</p>
      <div class="dash-progress-bar-track">
        <div class="dash-progress-bar-fill" style="width:${pct}%;"></div>
        <div class="dash-progress-bar-label">${pct}%</div>
      </div>
    </div>
    <div class="dash-progress-card">
      <p style="font-size:13px; font-weight:700; margin:0 0 4px;">🏪 매장별 작업 완료율</p>
      <p style="font-size:12px; color:var(--ink-soft); margin:0 0 12px;">가이드가 완성된 게임 ${readyGames.length}개 중, 그 매장 소속 누군가가 "작업 완료"를 체크한 게임 수입니다.</p>
      ${storeRows.length ? `<div class="store-progress">
        ${storeRows.map(r=>`
          <div><a href="javascript:void(0)" onclick="setDashboardStore_('${esc_(r.code)}'); setDashboardFilter('storeUndone');" title="이 매장에서 아직 안 한 게임 보기">${esc_(r.name)}</a> <span style="color:var(--ink-soft); font-size:11px;">${r.members}명</span></div>
          <div class="dash-progress-bar-track"><div class="dash-progress-bar-fill" style="width:${r.pct}%;"></div></div>
          <div style="text-align:right; font-weight:700;">${r.done}/${readyGames.length} · ${r.pct}%</div>
        `).join('')}
      </div>` : `<p style="font-size:12.5px; color:var(--ink-soft); margin:0;">매장 정보가 등록된 사용자가 없습니다.</p>`}
    </div>
    <div class="crop-toolbar" style="margin-bottom:14px; flex-wrap:wrap; align-items:center;">
      <button onclick="setDashboardFilter('all')" style="${btnStyle('all')}">전체</button>
      <button onclick="setDashboardFilter('undone')" style="${btnStyle('undone')}">가이드 미완료만</button>
      <button onclick="setDashboardFilter('done')" style="${btnStyle('done')}">가이드 완료만</button>
      <button onclick="setDashboardFilter('reports')" style="${btnStyle('reports')}">누락 신고 있음</button>
      <select onchange="setDashboardStore_(this.value); if (this.value) setDashboardFilter('storeUndone'); else if ('${dashboardFilter_}'==='storeUndone') setDashboardFilter('all');" style="padding:6px 8px; border:1.5px solid var(--line-strong); border-radius:7px; font-size:12.5px; ${btnStyle('storeUndone')}">
        <option value="">매장 선택: 이 매장 미완료 게임 보기</option>
        ${people.stores.map(s=>`<option value="${esc_(s.code)}" ${s.code===dashboardStore_?'selected':''}>${esc_(s.name)}</option>`).join('')}
      </select>
    </div>
    <div style="overflow-x:auto;">
    <table class="case-table">
      <thead><tr><th>이름</th><th>사진</th><th>가이드완료</th><th>작업 완료 매장</th>${dashboardStore_ ? `<th>${esc_(storeName(dashboardStore_))}</th>` : ''}<th>누락 신고</th><th></th></tr></thead>
      <tbody>
        ${filtered.map(g=>{
          const sd = storeDoneSets[games.indexOf(g)];
          const names = [...sd].map(storeName);
          const reports = openReportsOf_(g).length;
          return `
          <tr>
            <td>${esc_(g.name)}</td>
            <td>${(g.photos||[]).length ? '있음' : '-'}</td>
            <td><input type="checkbox" ${g.guideDone?'checked':''} onchange="toggleGuideDoneFor(this, '${g.id}')"></td>
            <td><span class="dash-count" title="${esc_(names.join(', ') || '없음')} (체크한 사람 ${(g.completedBy||[]).length}명)">${sd.size}개 매장</span></td>
            ${dashboardStore_ ? `<td>${sd.has(dashboardStore_) ? '✅' : '—'}</td>` : ''}
            <td>${reports ? `<span class="mini-badge warn">${reports}건</span>` : '-'}</td>
            <td><button class="btn btn-ghost2" style="width:auto; padding:5px 10px; font-size:12px;" onclick="openGame('${g.id}')">열기</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="7" style="color:var(--ink-soft);">해당하는 게임이 없습니다.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;
}

async function toggleGuideDoneFor(checkbox, gameId){
  const g = games.find(x=>x.id===gameId);
  g.guideDone = checkbox.checked;
  await updateDoc(doc(db, 'games', gameId), { guideDone: checkbox.checked });
}

let listSearch_ = '';
let listSort_ = 'name'; // 'name' | 'updated'
let listWorkFilter_ = 'all'; // 'all' | 'done' | 'undone' | 'fav' (작업 완료 여부 / 즐겨찾기 기준)
let listEditFilter_ = 'all'; // 편집자용 "편집 상태" 필터: 'all' | 'noPhoto' | 'noMarker' | 'mismatch' | 'reports' | 'noGuide'
let listSelectedIds_ = new Set(); // 목록에서 체크한 게임들 (필요 케이스 합계 확인용)

/** 편집 상태 판단: 표에는 있는데 어느 사진에도 마커가 없는 케이스 수 */
function unplacedCaseCount_(g){
  const placed = new Set();
  (g.photos||[]).forEach(p => (p.markers||[]).forEach(m => placed.add(m.caseIdx)));
  return (g.cases||[]).filter((c, ci) => !placed.has(ci)).length;
}
function markerCount_(g){ return (g.photos||[]).reduce((n,p)=> n + (p.markers||[]).length, 0); }

const LIST_EDIT_FILTERS_ = {
  all:      { label:'편집 상태: 전체',          test: ()=>true },
  noGuide:  { label:'가이드 준비중',             test: g=>!g.guideDone },
  noPhoto:  { label:'사진 없음',                 test: g=>!(g.photos||[]).length },
  noMarker: { label:'사진은 있는데 마커 없음',    test: g=>(g.photos||[]).length && !markerCount_(g) },
  mismatch: { label:'표에 있는데 사진 마커 없음', test: g=>(g.photos||[]).length && (g.cases||[]).length && unplacedCaseCount_(g) > 0 },
  reports:  { label:'누락 신고 있음',            test: g=>openReportsOf_(g).length > 0 },
};

function renderList(){
  if (!confirmLeaveDetail_()) { syncHash_(currentGameId); return; }
  syncHash_(null);
  leavePresence_();
  currentGameId = null;
  showDashboard_ = false;
  const editable = currentRole === 'editor';

  appEl.innerHTML = `
    <div class="list-toolbar">
      <select id="listSortSelect">
        <option value="name" ${listSort_==='name'?'selected':''}>이름순</option>
        <option value="updated" ${listSort_==='updated'?'selected':''}>최근 수정순</option>
      </select>
      <div class="tabs" id="listWorkFilterTabs" style="margin-bottom:0;">
        <button data-v="all" class="${listWorkFilter_==='all'?'active':''}" onclick="setListWorkFilter_('all')">전체</button>
        <button data-v="undone" class="${listWorkFilter_==='undone'?'active':''}" onclick="setListWorkFilter_('undone')">작업 미완료</button>
        <button data-v="done" class="${listWorkFilter_==='done'?'active':''}" onclick="setListWorkFilter_('done')">작업 완료</button>
        <button data-v="fav" class="${listWorkFilter_==='fav'?'active':''}" onclick="setListWorkFilter_('fav')">⭐ 즐겨찾기</button>
      </div>
      ${editable ? `
        <select id="listEditFilterSelect" title="편집이 덜 된 게임 찾기">
          ${Object.entries(LIST_EDIT_FILTERS_).map(([k,v])=>`<option value="${k}" ${listEditFilter_===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        ${trashedGames_.length ? `<button class="btn btn-ghost2" style="width:auto;" onclick="renderTrash_()">🗑️ 휴지통 (${trashedGames_.length})</button>` : ''}
      ` : ''}
    </div>
    <div id="listQuickSlot"></div>
    <div id="listSelectionSlot"></div>
    <div id="listCountSlot" style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;"></div>
    <div class="game-list" id="gameListResults"></div>
  `;

  // 검색창은 상단바에 고정으로 있는 걸 그대로 씁니다 (게임 상세 화면 등 어디에 있든
  // 계속 보이고, 입력하는 즉시 이 목록 화면으로 돌아와 이어서 검색됩니다).
  document.getElementById('listSortSelect').addEventListener('change', (e)=>{
    listSort_ = e.target.value;
    renderGameListResults_();
  });
  const editSel = document.getElementById('listEditFilterSelect');
  if (editSel) editSel.addEventListener('change', (e)=>{
    listEditFilter_ = e.target.value;
    renderGameListResults_();
  });

  renderGameListResults_();
}

function setListWorkFilter_(v){
  listWorkFilter_ = v;
  document.querySelectorAll('#listWorkFilterTabs button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  renderGameListResults_();
}

/** 상단바 검색창(어느 화면에 있든 항상 보임)에 입력하면, 목록 화면이 아니면 목록으로
 *  전환하면서 바로 그 검색어로 이어서 필터링합니다. */
function onTopSearchInput(v){
  listSearch_ = v;
  if (document.getElementById('gameListResults')){
    renderGameListResults_(); // 이미 목록 화면이면 결과만 가볍게 갱신
  } else {
    renderList(); // 다른 화면(게임 상세 등)이면 목록으로 전환
  }
}

/** 즐겨찾기 · 최근 본 게임을 목록 위에 바로가기 버튼으로 보여줍니다 (검색 중이 아닐 때만). */
function renderListQuickRows_(){
  const slot = document.getElementById('listQuickSlot');
  if (!slot) return;
  if (listSearch_){ slot.innerHTML = ''; return; }
  const byId = id => games.find(g=>String(g.id)===id);
  const favs = getFavorites_().map(byId).filter(Boolean);
  const recent = getRecent_().map(byId).filter(Boolean);
  const chip = g => `<button class="quick-chip" onclick="openGame('${g.id}')">${esc_(g.name || '(이름 없음)')}</button>`;
  slot.innerHTML =
    (favs.length ? `<div class="quick-row"><span class="quick-row-title">⭐ 즐겨찾기</span>${favs.map(chip).join('')}</div>` : '') +
    (recent.length ? `<div class="quick-row"><span class="quick-row-title">🕘 최근 본 게임</span>${recent.map(chip).join('')}</div>` : '');
}

function renderGameListResults_(){
  const container = document.getElementById('gameListResults');
  const selectionSlot = document.getElementById('listSelectionSlot');
  if (!container) return;
  const editable = currentRole === 'editor';
  const myEmail = auth.currentUser?.email?.toLowerCase();
  const favs = new Set(getFavorites_());

  let filtered = games.filter(g => !listSearch_ || (g.name||'').includes(listSearch_) || String(g.id) === listSearch_.trim() || (isChosungOnly(listSearch_) && getChosung(g.name||'').includes(listSearch_)));
  if (listWorkFilter_ === 'fav'){
    filtered = filtered.filter(g => favs.has(String(g.id)));
  } else if (listWorkFilter_ !== 'all'){
    filtered = filtered.filter(g=>{
      const isDone = myEmail && (g.completedBy||[]).includes(myEmail);
      return listWorkFilter_ === 'done' ? isDone : !isDone;
    });
  }
  if (editable && listEditFilter_ !== 'all' && LIST_EDIT_FILTERS_[listEditFilter_]){
    filtered = filtered.filter(LIST_EDIT_FILTERS_[listEditFilter_].test);
  }
  filtered = filtered.slice().sort((a,b)=>{
    if (listSort_ === 'updated') return (b.updatedAt||0) - (a.updatedAt||0);
    return String(a.name||'').localeCompare(String(b.name||''), 'ko');
  });

  renderListQuickRows_();
  if (selectionSlot) selectionSlot.innerHTML = listSelectedIds_.size > 0 ? renderListSelectionSummary_() : '';
  const countSlot = document.getElementById('listCountSlot');
  if (countSlot) countSlot.textContent = filtered.length !== games.length ? `${filtered.length}개 게임 (전체 ${games.length}개)` : `전체 ${games.length}개 게임`;

  container.innerHTML = filtered.length ? filtered.map(g=>{
    const done = myEmail && (g.completedBy||[]).includes(myEmail);
    const checked = listSelectedIds_.has(String(g.id));
    const fav = favs.has(String(g.id));
    const thumbPath = (g.photos||[])[0]?.thumbPath;
    const reports = openReportsOf_(g).length;
    const badges = [];
    if (reports) badges.push(`<span class="mini-badge warn">누락 신고 ${reports}</span>`);
    if (editable){
      if (!(g.photos||[]).length) badges.push('<span class="mini-badge">사진 없음</span>');
      else if (!markerCount_(g)) badges.push('<span class="mini-badge">마커 없음</span>');
      else { const n = unplacedCaseCount_(g); if (n) badges.push(`<span class="mini-badge">마커 없는 케이스 ${n}</span>`); }
    }
    return `
    <div class="game-card ${g.guideDone ? '' : 'no-guide'} ${done ? 'work-done' : ''}" style="position:relative;">
      <div style="display:flex; align-items:center; gap:7px; margin-bottom:2px;">
        <input type="checkbox" class="card-select" ${checked?'checked':''} onclick="event.stopPropagation();" onchange="toggleGameSelect_('${g.id}')" title="선택해서 필요 케이스 모아보기">
        <div class="meta" style="flex:1;">ID ${esc_(g.id)}</div>
        <button class="fav-btn ${fav?'on':''}" onclick="event.stopPropagation(); toggleFavorite_('${g.id}')" title="${fav?'즐겨찾기 해제':'즐겨찾기에 추가'}" style="${editable?'margin-right:18px;':''}">${fav?'★':'☆'}</button>
      </div>
      <div onclick="openGame('${g.id}')" style="cursor:pointer;">
        ${thumbPath ? `<div class="card-thumb" data-thumb-path="${esc_(thumbPath)}"></div>` : ''}
        <div class="name">${esc_(g.name || '(이름 없음)')}</div>
        <div class="meta">케이스 ${(g.cases||[]).length}개${g.guideDone ? '' : ' · 가이드 준비중'}</div>
        ${badges.length ? `<div class="card-badges">${badges.join('')}</div>` : ''}
      </div>
      <label style="display:flex; align-items:center; gap:5px; margin-top:8px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;">
        <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation(); toggleWorkComplete('${g.id}', this.checked, this)"> 작업 완료
      </label>
      ${editable ? `<button onclick="event.stopPropagation(); deleteGame('${g.id}')" style="position:absolute; top:12px; right:12px; border:none; background:none; color:var(--ink-soft); cursor:pointer;" title="휴지통으로 이동">✕</button>` : ''}
    </div>
  `;}).join('') : '<div class="empty">검색 결과가 없습니다.</div>';

  observeCardThumbs_(container);
}

/** 카드 썸네일은 화면에 보일 때만 주소를 받아와서 불러옵니다 (게임이 많아도 목록이 느려지지 않게). */
let thumbObserver_ = null;
function observeCardThumbs_(container){
  const els = container.querySelectorAll('.card-thumb[data-thumb-path]');
  if (!els.length) return;
  const load = async (el)=>{
    const path = el.dataset.thumbPath;
    el.removeAttribute('data-thumb-path');
    try{ el.style.backgroundImage = `url('${await resolvePhotoUrl_(path)}')`; }catch(e){ el.remove(); }
  };
  if (!('IntersectionObserver' in window)){ els.forEach(load); return; }
  if (thumbObserver_) thumbObserver_.disconnect();
  thumbObserver_ = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if (en.isIntersecting){ thumbObserver_.unobserve(en.target); load(en.target); } });
  }, { rootMargin: '200px' });
  els.forEach(el=>thumbObserver_.observe(el));
}

/** 목록 카드의 체크박스로 게임을 선택/해제하고, 선택된 게임들의 필요 케이스 합계를 갱신합니다. */
function toggleGameSelect_(id){
  id = String(id);
  if (listSelectedIds_.has(id)) listSelectedIds_.delete(id);
  else listSelectedIds_.add(id);
  renderGameListResults_();
}

function clearListSelection_(){
  listSelectedIds_.clear();
  renderGameListResults_();
}

function renderListSelectionSummary_(){
  const selected = games.filter(g => listSelectedIds_.has(String(g.id)));
  const counts = {};
  selected.forEach(g => (g.cases||[]).forEach(c => { counts[c.caseType] = (counts[c.caseType]||0) + 1; }));
  const types = PURCHASE_TYPES.filter(t=>counts[t]); // 실제 정해진 케이스가 필요한 종류만 (구성품/지퍼백은 제외)

  return `<div class="selection-panel">
    <div class="selection-head">
      <span>${selected.length}개 게임 선택됨 · 필요한 케이스 합계</span>
      <span style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-ghost2" style="width:auto; padding:4px 10px; font-size:12px;" onclick="printQrSheet_()" title="선택한 게임들의 바로가기 QR 코드를 한 장에 모아 인쇄합니다 (게임 박스에 붙여두기용)">🔳 QR 코드 인쇄</button>
        <button class="btn btn-ghost2" style="width:auto; padding:4px 10px; font-size:12px;" onclick="clearListSelection_()">선택 해제</button>
      </span>
    </div>
    <div class="selection-games">

async function toggleWorkComplete(gameId, checked, checkboxEl){
  const myEmail = auth.currentUser?.email?.toLowerCase();
  if (!myEmail) return;
  // 서버 응답을 기다리지 않고, 체크하자마자 카드 색상부터 바로 바꿔줍니다.
  const card = checkboxEl && checkboxEl.closest('.game-card');
  if (card) card.classList.toggle('work-done', checked);

  const gameRef = doc(db, 'games', gameId);
  const g = games.find(x=>x.id===gameId);
  g.completedBy = g.completedBy || [];
  if (checked && !g.completedBy.includes(myEmail)) g.completedBy.push(myEmail);
  if (!checked) g.completedBy = g.completedBy.filter(e=>e!==myEmail);
  try{
    // 목록 전체를 덮어쓰지 않고 "내 이메일만" 넣고 빼서, 여러 사람이 동시에 체크해도 서로 지워지지 않게 합니다.
    await updateDoc(gameRef, { completedBy: checked ? arrayUnion(myEmail) : arrayRemove(myEmail) });
  }catch(e){
    // 저장에 실패하면 화면 표시도 원래대로 되돌립니다.
    if (checked) g.completedBy = g.completedBy.filter(e=>e!==myEmail);
    else g.completedBy.push(myEmail);
    if (card) card.classList.toggle('work-done', !checked);
    if (checkboxEl) checkboxEl.checked = !checked;
    alert('작업 완료 상태를 저장하지 못했습니다: ' + e.message);
  }
}

/** 게임을 바로 지우지 않고 휴지통으로 옮깁니다. 편집자는 목록의 "🗑️ 휴지통"에서 복구할 수 있습니다. */
async function deleteGame(gameId){
  const g = games.find(x=>x.id===gameId);
  if (!confirm(`"${g?.name || gameId}" 게임을 휴지통으로 옮길까요?\n(목록의 "🗑️ 휴지통"에서 다시 복구할 수 있습니다)`)) return;
  try{
    await updateDoc(doc(db, 'games', gameId), { deleted: true, deletedAt: Date.now(), deletedBy: auth.currentUser?.email?.toLowerCase() || '' });
  }catch(e){
    alert('휴지통으로 옮기지 못했습니다: ' + e.message);
    return;
  }
  listSelectedIds_.delete(String(gameId));
  await loadGames();
  renderList();
}

async function purgeGame_(gameId){

async function createNewGame(){
  const id = prompt('새 게임의 ID를 입력하세요 (숫자 또는 문자, 다른 게임과 겹치면 안 됩니다):');
  if (id === null) return;
  const trimmedId = id.trim();
  if (!trimmedId){ alert('게임 ID를 입력해주세요.'); return; }
  if (!isValidGameId_(trimmedId)){ alert('게임 ID에는 공백이나 따옴표, 슬래시(/), #, ?, % 같은 특수문자를 쓸 수 없습니다.'); return; }
  if (isGameIdTaken_(trimmedId)){
    alert(`ID "${trimmedId}"는 이미 사용 중입니다${trashedGames_.some(x=>String(x.id)===trimmedId) ? ' (휴지통에 있는 게임)' : ''}. 다른 ID를 입력해주세요.`);
    return;
  }
  const name = prompt('새 게임 이름을 입력하세요:');
  if (!name || !name.trim()) return;
  await setDoc(doc(db, 'games', trimmedId), {
    name: name.trim(),
    cases: [],
    guideDone: false,
    completedBy: [],
    note: '',
    updatedAt: Date.now()
  });
  await loadGames();
  openGame(trimmedId);
}

async function openGame(id){
  if (String(id) !== String(currentGameId) && !confirmLeaveDetail_()) { syncHash_(currentGameId); return; }
  leavePresence_(); // 이전 게임에 있던 접속/잠금 정리
  showDashboard_ = false;
  currentGameId = id;
  currentMode = 'photo';
  currentPhotoIdx = 0;
  pushRecent_(id);
  syncHash_(id);
  resetChangeTracking_();
  renderDetail();

  if (currentRole === 'editor'){
    const gotLock = await ensureEditLockForGame_(id);
    if (!gotLock){
      currentRole = 'viewer';
      updateRoleToggleUI_();
    } else {
      enterPresence_(id);
    }
    renderDetail();
  }
}

/** 게임 이름을 바꿉니다. 실수로 바뀌지 않도록, ID 변경처럼 별도 버튼 → 입력창 → 확인 절차를 거칩니다. */
async function changeGameName_(){
  const g = games.find(x=>x.id===currentGameId);
  if (!g) return;
  const newName = prompt(`새 게임 이름을 입력하세요 (현재: ${g.name || ''}):`, g.name || '');
  if (newName === null) return; // 취소
  const trimmed = newName.trim();
  if (!trimmed || trimmed === g.name) return;
  if (!confirm(`게임 이름을 "${g.name || '(이름 없음)'}" → "${trimmed}"로 변경하시겠습니까?`)) return;

  try{
    g.name = trimmed;
    await updateDoc(doc(db, 'games', g.id), { name: trimmed, updatedAt: Date.now() });
    renderDetail();
  }catch(e){
    alert('이름 변경 중 문제가 발생했습니다: ' + e.message);
  }
}

/**
 * 게임 ID를 바꿉니다. Firestore는 문서 ID를 직접 바꿀 수 없어서,
 * 새 ID로 문서(+이전 버전 기록)를 통째로 복사한 뒤 기존 문서를 지우는 방식으로 처리합니다.
 */
async function changeGameId_(){
  const g = games.find(x=>x.id===currentGameId);
  if (!g) return;
  const newId = prompt(`새 게임 ID를 입력하세요 (현재: ${g.id}):`, g.id);
  if (newId === null) return;
  const trimmed = newId.trim();
  if (!trimmed || trimmed === g.id) return;
  if (!isValidGameId_(trimmed)){ alert('게임 ID에는 공백이나 따옴표, 슬래시(/), #, ?, % 같은 특수문자를 쓸 수 없습니다.'); return; }
  if (isGameIdTaken_(trimmed)){
    alert(`ID "${trimmed}"는 이미 다른 게임이 사용 중입니다${trashedGames_.some(x=>String(x.id)===trimmed) ? ' (휴지통에 있는 게임)' : ''}.`);
    return;
  }
  if (!confirm(`게임 ID를 "${g.id}" → "${trimmed}"로 변경할까요?\n이전 버전 기록도 함께 옮겨집니다. 되돌릴 수 없습니다.`)) return;

  try{
    const oldId = g.id;
    const { id, editLockHolder, editLockAt, ...data } = g; // 편집 잠금 정보는 새 ID로 옮기지 않습니다.
    await setDoc(doc(db, 'games', trimmed), { ...data, updatedAt: Date.now() });
    resetChangeTracking_(); // 바뀐 내용까지 새 ID 문서에 그대로 복사됐으므로, "저장 안 됨" 상태를 비웁니다

    // 이전 버전 기록(history)도 그대로 복사합니다.
    const historySnap = await getDocs(collection(db, 'games', oldId, 'history'));
    for (const d of historySnap.docs){
      await setDoc(doc(db, 'games', trimmed, 'history', d.id), d.data());
    }

    leavePresence_(); // 옛 ID에 남아있던 편집 잠금/접속 표시를 정리합니다.
    await deleteDoc(doc(db, 'games', oldId));

    await loadGames();
    openGame(trimmed);
  }catch(e){
    alert('게임 ID 변경 중 문제가 발생했습니다: ' + e.message);
  }
}
